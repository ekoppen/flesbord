<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>De Fles — beheerscherm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Shadows+Into+Light+Two&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  html { color-scheme: dark; }
  html, body { margin: 0; padding: 0; background: #2c3e35; }
  input::placeholder, textarea::placeholder { color: rgba(242,236,220,0.38); }
  body {
    min-height: 100vh; background: #2c3e35;
    background-image: radial-gradient(ellipse 600px 380px at 18% 12%, rgba(244,238,222,0.05), transparent 70%),
      radial-gradient(ellipse 700px 420px at 82% 50%, rgba(244,238,222,0.04), transparent 70%),
      radial-gradient(ellipse 500px 300px at 30% 90%, rgba(244,238,222,0.035), transparent 70%);
    font-family: 'Patrick Hand', cursive; color: #f2ecdc;
    padding: 40px 24px 80px; box-sizing: border-box;
  }
  .wrap { max-width: 1060px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
  .card { border: 2px solid rgba(242,236,220,0.25); background: rgba(15,24,20,0.18); border-radius: 14px; padding: 24px 28px; }
  .card-h { font-family: 'Amatic SC', cursive; font-weight: 700; font-size: 33px; letter-spacing: 0.06em; }
  .lbl { font-size: 14px; letter-spacing: 0.18em; color: rgba(242,236,220,0.55); margin-bottom: 6px; }
  .in {
    border: 2px solid rgba(242,236,220,0.3); border-radius: 10px; padding: 8px 14px;
    font-family: 'Patrick Hand', cursive; font-size: 17px; background: rgba(242,236,220,0.07);
    color: #f2ecdc; outline: none; box-sizing: border-box; min-width: 0;
  }
  .in:focus { border-color: #f4a259; }
  select.in { font-size: 16px; padding: 8px 12px; }
  .btn-orange {
    cursor: pointer; border: none; background: #f4a259; color: #2c3e35;
    font-family: 'Amatic SC', cursive; font-weight: 700; font-size: 22px; letter-spacing: 0.06em;
    border-radius: 10px; padding: 8px 20px;
  }
  .btn-pill {
    cursor: pointer; border: none; background: #f2ecdc; color: #2c3e35;
    font-family: 'Amatic SC', cursive; font-weight: 700; font-size: 24px; letter-spacing: 0.06em;
    border-radius: 999px; padding: 8px 24px; box-shadow: 0 6px 16px rgba(0,0,0,0.3);
    text-decoration: none; display: inline-block;
  }
  .btn-dash {
    cursor: pointer; border: 2px dashed rgba(242,236,220,0.35); background: transparent; border-radius: 10px;
    padding: 8px 18px; font-family: 'Amatic SC', cursive; font-weight: 700; font-size: 22px;
    letter-spacing: 0.06em; color: rgba(242,236,220,0.7);
  }
  .btn-dash:hover { color: #f4a259; border-color: #f4a259; }
  .btn-x {
    cursor: pointer; width: 36px; height: 36px; border-radius: 10px; border: 2px solid rgba(242,236,220,0.25);
    background: transparent; color: rgba(242,236,220,0.6); font-size: 15px; line-height: 1;
  }
  .btn-x:hover, .btn-ghost:hover { color: #f4a259; border-color: #f4a259; }
  .btn-step {
    cursor: pointer; width: 32px; height: 36px; border-radius: 10px; border: 2px solid rgba(242,236,220,0.3);
    background: transparent; color: #f2ecdc; font-size: 16px;
  }
  .btn-ghost {
    cursor: pointer; border: 2px solid rgba(242,236,220,0.3); background: transparent; border-radius: 999px;
    padding: 7px 18px; font-family: 'Patrick Hand', cursive; font-size: 15px; color: rgba(242,236,220,0.6);
  }
  .status { font-size: 15px; color: #f4a259; margin-top: 10px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
  .tap-row { display: grid; grid-template-columns: 1fr 1fr 110px 170px 36px; gap: 10px; align-items: center; }
  .stock-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 24px; }
  .stock-row { display: grid; grid-template-columns: 1fr 110px 128px 36px; gap: 10px; align-items: center; }
  @media (max-width: 820px) {
    .row2, .stock-grid { grid-template-columns: 1fr; }
    .tap-row { grid-template-columns: 1fr 1fr; grid-auto-rows: auto; }
    body { padding: 24px 14px 60px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <!-- Kop -->
  <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; padding: 0 4px 8px; flex-wrap: wrap;">
    <div>
      <div style="font-family: 'Shadows Into Light Two', cursive; font-size: 28px; color: #f4a259; line-height: 1; transform: rotate(-1.5deg);">beheerscherm</div>
      <div style="font-family: 'Amatic SC', cursive; font-weight: 700; font-size: 64px; line-height: 0.95; letter-spacing: 0.04em; text-shadow: 0 0 14px rgba(242,236,220,0.18);">DE FLES</div>
    </div>
    <div style="display: flex; align-items: center; gap: 16px; padding-bottom: 6px; flex-wrap: wrap;">
      <div data-saved style="font-family: 'Shadows Into Light Two', cursive; font-size: 20px; color: #8fd6a0; visibility: hidden;">opgeslagen ✓</div>
      <div style="display: flex; align-items: center; gap: 9px; border: 2px solid rgba(242,236,220,0.3); border-radius: 999px; padding: 8px 16px;">
        <div style="width: 9px; height: 9px; border-radius: 999px; background: #8fd6a0;"></div>
        <div style="font-size: 15px; color: rgba(242,236,220,0.75);">Live — wijzigingen verschijnen direct op TV</div>
      </div>
      <a class="btn-pill" href="/tv/" target="_blank" style="transform: rotate(-0.6deg);">OPEN TV-SCHERM ↗</a>
    </div>
  </div>
  <div id="cards"></div>
</div>
<script type="module" src="./admin.js"></script>
</body>
</html>
