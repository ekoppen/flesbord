<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>De Fles — bar · tuinhuis</title>
<meta name="robots" content="noindex">
<meta name="description" content="De Fles — bar in het tuinhuis.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Shadows+Into+Light+Two&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    min-height: 100%; display: flex; align-items: center; justify-content: center;
    padding: 24px;
    font-family: 'Patrick Hand', cursive; color: #f2ecdc;
    background: linear-gradient(135deg, #87603b, #6b4527 38%, #7d5731 70%, #5e3d22);
  }
  /* houten lijst → krijtbord */
  .frame { width: 100%; max-width: 640px; padding: 16px; border-radius: 10px;
    background: linear-gradient(135deg, #87603b, #6b4527 38%, #7d5731 70%, #5e3d22);
    box-shadow: inset 0 2px 0 rgba(255,235,200,0.25), inset 0 -2px 6px rgba(0,0,0,0.45), 0 24px 60px rgba(0,0,0,0.5); }
  .board {
    border-radius: 6px; padding: 48px 40px 44px; text-align: center;
    background: #2c3e35;
    background-image:
      radial-gradient(ellipse 420px 280px at 20% 24%, rgba(244,238,222,0.06), transparent 70%),
      radial-gradient(ellipse 500px 320px at 80% 78%, rgba(244,238,222,0.05), transparent 70%);
    box-shadow: inset 0 0 60px rgba(0,0,0,0.35);
  }
  .script { font-family: 'Shadows Into Light Two', cursive; color: #f4a259; }
  .welkom { font-size: 26px; transform: rotate(-1.5deg); }
  .logo { font-family: 'Amatic SC', cursive; font-weight: 700; font-size: clamp(72px, 16vw, 120px); line-height: 0.92; letter-spacing: 0.04em; text-shadow: 0 0 16px rgba(242,236,220,0.2); margin: 2px 0; }
  .sub { font-size: 14px; letter-spacing: 0.4em; color: rgba(242,236,220,0.55); }
  .rule { border-top: 3px dashed rgba(242,236,220,0.35); margin: 28px auto; max-width: 360px; }
  .lead { font-family: 'Amatic SC', cursive; font-weight: 700; font-size: 34px; line-height: 1.1; color: #f2ecdc; }
  .body { font-size: 18px; line-height: 1.6; color: rgba(242,236,220,0.85); max-width: 440px; margin: 14px auto 0; }
  .tag { display: inline-block; margin-top: 26px; font-family: 'Shadows Into Light Two', cursive; font-size: 24px; color: #f4a259; transform: rotate(-1deg); }
  /* equalizer-knipoog */
  .eq { display: flex; gap: 5px; align-items: flex-end; height: 26px; justify-content: center; margin-top: 30px; }
  .eq i { width: 6px; height: 100%; border-radius: 4px; background: #f4a259; transform-origin: bottom; animation: eq 0.9s ease-in-out infinite alternate; }
  .eq i:nth-child(2){ animation-duration: 0.7s; } .eq i:nth-child(3){ animation-duration: 1.05s; } .eq i:nth-child(4){ animation-duration: 0.8s; }
  @keyframes eq { from { transform: scaleY(0.25); } to { transform: scaleY(1); } }
</style>
</head>
<body>
  <div class="frame">
    <div class="board">
      <div class="script welkom">welkom in</div>
      <div class="logo">DE FLES</div>
      <div class="sub">BAR · TUINHUIS</div>
      <div class="rule"></div>
      <div class="lead">Hier valt weinig te beleven…</div>
      <div class="body">Het echte feest is in het tuinhuis. Heb je een uitnodiging gekregen? Volg dan je persoonlijke link om je aan te melden — dan weten we dat je komt. 🍻</div>
      <div class="tag">tot bij de tap!</div>
      <div class="eq"><i></i><i></i><i></i><i></i></div>
    </div>
  </div>
</body>
</html>
