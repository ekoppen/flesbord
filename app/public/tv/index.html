<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>De Fles — TV-krijtbord</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Shadows+Into+Light+Two&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #1f2b25; overflow: hidden; }
  * { cursor: none; }
  @keyframes defles-eq { from { transform: scaleY(0.2); } to { transform: scaleY(1); } }
  @keyframes defles-fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes defles-marquee { from { transform: translateX(100%); } to { transform: translateX(-100%); } }
  @keyframes defles-pop {
    0%   { transform: rotate(-2deg) scale(1); }
    25%  { transform: rotate(-2deg) scale(1.22); }
    45%  { transform: rotate(2deg) scale(1.1); }
    65%  { transform: rotate(-2deg) scale(0.98); }
    100% { transform: rotate(-2deg) scale(1); }
  }
</style>
</head>
<body>
<div style="position: fixed; inset: 0; background: #1f2b25; font-family: 'Patrick Hand', cursive; color: #f2ecdc;">
  <div id="frame" style="position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform: translate(-50%, -50%) scale(1); box-sizing: border-box; padding: 22px; background: linear-gradient(135deg, #87603b, #6b4527 38%, #7d5731 70%, #5e3d22); box-shadow: inset 0 2px 0 rgba(255,235,200,0.25), inset 0 -2px 6px rgba(0,0,0,0.45);">
    <div id="board" style="width: 100%; height: 100%; box-sizing: border-box; border-radius: 6px; background: #2c3e35; background-image: radial-gradient(ellipse 600px 380px at 18% 28%, rgba(244,238,222,0.05), transparent 70%), radial-gradient(ellipse 700px 420px at 78% 72%, rgba(244,238,222,0.04), transparent 70%), radial-gradient(ellipse 500px 300px at 60% 8%, rgba(244,238,222,0.035), transparent 70%), radial-gradient(ellipse 400px 500px at 5% 85%, rgba(244,238,222,0.03), transparent 70%); box-shadow: inset 0 0 60px rgba(0,0,0,0.35); position: relative;"></div>
  </div>
</div>
<script type="module" src="./tv.js"></script>
</body>
</html>
